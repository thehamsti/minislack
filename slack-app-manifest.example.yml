display_information:
  name: Mini Slack
  description: A compact, keyboard-first Slack client for macOS
  background_color: "#D95F20"

oauth_config:
  pkce_enabled: true
  redirect_urls:
    - minislack://oauth/slack
  scopes:
    user:
      - channels:history
      - channels:read
      - channels:write
      - chat:write
      - dnd:read
      - emoji:read
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - reactions:read
      - users:read

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
